name: CI

on:
  push:
    branches:
      - main
      - 'refactor/**'
      - 'fix/**'
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python312-syntax:
    name: Python 3.12 syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m compileall -q joymedia scripts deploy

  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: '3.12'
            frappe: version-15
            node: '20'
          - python: '3.14'
            frappe: version-16
            node: '24'
    name: Server (Python ${{ matrix.python }}, Frappe ${{ matrix.frappe }})

    services:
      redis-cache:
        image: redis:alpine
        ports:
          - 13000:6379
      redis-queue:
        image: redis:alpine
        ports:
          - 11000:6379
      mariadb:
        image: mariadb:10.6
        env:
          MARIADB_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: --health-cmd="mariadb-admin ping -h localhost -u root -proot" --health-interval=5s --health-timeout=2s --health-retries=20

    steps:
      - name: Clone
        uses: actions/checkout@v6

      - name: Find tests
        run: |
          echo "Finding tests"
          grep -rn "def test" > /dev/null

      - name: Verify application layout
        run: python scripts/verify_app_layout.py

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          check-latest: true
          cache: npm
          cache-dependency-path: joymedia/frontend/package-lock.json

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-py${{ matrix.python }}-${{ matrix.frappe }}-pip-${{ hashFiles('**/*requirements.txt', '**/pyproject.toml', '**/setup.py', '**/setup.cfg') }}
          restore-keys: |
            ${{ runner.os }}-pip-
            ${{ runner.os }}-

      - name: Install system dependencies
        run: |
          sudo apt update
          sudo apt-get install --yes mariadb-client ffmpeg

      - name: Static checks
        run: |
          pip install ruff==0.14.10
          python scripts/verify_app_layout.py
          bash -n deploy/gpu-release.sh
          bash -n deploy/joymedia-tunnel.sh deploy/joymedia-comfyui-tunnel.sh
          ruff check joymedia scripts deploy
          ruff format --check joymedia scripts deploy

      - name: Setup
        run: |
          python -m venv "$RUNNER_TEMP/bench-cli"
          "$RUNNER_TEMP/bench-cli/bin/pip" install 'frappe-bench==5.31.0'
          echo "$RUNNER_TEMP/bench-cli/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/bench-cli/bin/bench" init --skip-redis-config-generation --skip-assets --python "$(which python)" --frappe-branch '${{ matrix.frappe }}' ~/frappe-bench

      - name: Install
        working-directory: /home/runner/frappe-bench
        run: |
          bench get-app --skip-assets joymedia "$GITHUB_WORKSPACE"
          bench setup requirements --dev
          ./env/bin/pip install --only-binary=opencv-python-headless -e 'apps/joymedia[tracking,cinematography,narration]'
          bench new-site --db-root-password root --admin-password admin test_site
          python apps/joymedia/scripts/ensure_bench_app.py sites/apps.txt joymedia
          bench --site test_site install-app joymedia
          bench build
        env:
          CI: 'Yes'

      - name: Run Tests
        working-directory: /home/runner/frappe-bench
        run: |
          bench --site test_site set-config allow_tests true
          python apps/joymedia/scripts/run_tests.py test_site
        env:
          TYPE: server

      - name: Build frontend
        working-directory: /home/runner/frappe-bench/apps/joymedia/joymedia/frontend
        run: |
          npm ci
          node --test tests/*.test.mjs
          npm run build
