worker_processes 2;
error_log /home/ubuntu/joymedia-demo-staging/nginx-error.log warn;
pid /home/ubuntu/joymedia-demo-staging/nginx.pid;

events { worker_connections 1024; }

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;
    sendfile on;
    tcp_nopush on;
    keepalive_timeout 30;
    autoindex off;

    # Exclude query strings, cookies and authorization from operational logs.
    log_format routing '$remote_addr [$time_local] "$request_method $uri $server_protocol" '
        '$status bytes=$body_bytes_sent rt=$request_time upstream=$upstream_addr '
        'upstream_bytes=$upstream_response_length upstream_time=$upstream_response_time';
    access_log /home/ubuntu/joymedia-demo-staging/nginx-access.log routing;

    client_body_temp_path /home/ubuntu/joymedia-demo-staging/nginx-tmp;
    proxy_temp_path /home/ubuntu/joymedia-demo-staging/nginx-proxy-tmp;
    fastcgi_temp_path /home/ubuntu/joymedia-demo-staging/nginx-fastcgi-tmp;
    uwsgi_temp_path /home/ubuntu/joymedia-demo-staging/nginx-uwsgi-tmp;
    scgi_temp_path /home/ubuntu/joymedia-demo-staging/nginx-scgi-tmp;

    gzip on;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    map $http_upgrade $connection_upgrade { default upgrade; '' close; }
    map $uri $asset_cache_control {
        default "public, max-age=3600, must-revalidate";
        "~^/assets/joymedia/frontend/assets/.+-[A-Za-z0-9_-]{8,}\.(js|css|woff2?)$" "public, max-age=31536000, immutable";
    }
    # Match Frappe's forced-download extensions for untrusted uploaded content.
    map "$upstream_http_content_disposition:$uri" $file_disposition {
        default "";
        ~*^:.*\.(svg|svgz|html|htm|xhtml|xht|shtml|shtm|mhtml|mht|xml|xsl|xslt|swf)$ attachment;
    }

    map $upstream_http_cache_control $private_cache_control {
        default "";
        "" "private, no-store";
    }

    upstream joymedia_web { server 127.0.0.1:18080; keepalive 8; }
    upstream joymedia_socketio { server unix:/home/ubuntu/joymedia-demo-staging/socketio.sock; }

    server {
        listen 127.0.0.1:18081;
        client_max_body_size 100m;
        root /home/ubuntu/joymedia-demo-staging/bench/sites/demo.localhost/public;

        proxy_http_version 1.1;
        proxy_connect_timeout 5s;
        proxy_read_timeout 120s;
        proxy_cache off;
        proxy_set_header Host demo.localhost;
        proxy_set_header X-Frappe-Site-Name demo.localhost;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Use-X-Accel-Redirect "1";
        proxy_set_header Connection "";

        location ~ (^|/)\. { return 404; }

        location /assets/ {
            alias /home/ubuntu/joymedia-demo-staging/bench/sites/assets/;
            limit_except GET { deny all; }
            add_header Cache-Control $asset_cache_control;
            add_header X-Content-Type-Options nosniff always;
        }
        location /files/ {
            try_files $uri =404;
            disable_symlinks on;
            limit_except GET { deny all; }
            add_header Cache-Control "public, max-age=300, must-revalidate";
            add_header Content-Disposition $file_disposition;
            add_header X-Content-Type-Options nosniff always;
        }

        # Only Frappe's successful authorization response can reach this route.
        location ^~ /protected/private/ {
            internal;
            alias /home/ubuntu/joymedia-demo-staging/bench/sites/demo.localhost/private/;
            disable_symlinks on;
            limit_except GET { deny all; }
            add_header Cache-Control $private_cache_control always;
            add_header Content-Disposition $file_disposition;
            add_header X-Content-Type-Options nosniff always;
        }
        location /protected/ { return 404; }
        location /private/files/ {
            proxy_pass http://joymedia_web;
        }
        location /private/ { return 404; }

        location /socket.io/ {
            proxy_pass http://joymedia_socketio;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header Origin $http_origin;
            proxy_set_header X-Frappe-Site-Name demo.localhost;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_buffering off;
            proxy_read_timeout 75s;
        }
        location / { proxy_pass http://joymedia_web; }
    }
}
